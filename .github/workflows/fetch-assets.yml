# Fetches site media into /assets and commits it to the branch the workflow runs on.
# Run manually (Actions tab or API) with any of:
#   manifest     = JSON {"file-name": "https://…canva…"}: photos, optimised to JPG
#   video_search = a keyword ("ocean waves"): lists free Mixkit clips in the job log only
#   video_url    = clip URL(s), comma-separated (assets.mixkit.co / videos.pexels.com), each trimmed
#                  and encoded to assets/<name>.mp4 + assets/<name>-poster.jpg, with <name> taken
#                  from video_name (same order). The hero uses hero-wide (landscape) and hero-tall (portrait).
# Mixkit and Pexels clips are free for commercial use with no attribution required.
name: Fetch assets

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'JSON object: {"hero-beach": "https://export-download.canva.com/…", …}'
        required: false
      video_search:
        description: 'Keywords, comma-separated, to list Mixkit clips for (log only)'
        required: false
      video_url:
        description: 'Clip URL(s), comma-separated (assets.mixkit.co / videos.pexels.com)'
        required: false
      video_name:
        description: 'Output name(s) for each clip, comma-separated (e.g. hero-wide,hero-tall)'
        required: false
        default: 'hero-wide'
      video_start:
        description: 'Seconds to skip at the start of the clip'
        required: false
        default: '0'
      video_duration:
        description: 'Seconds to keep (the site loops it)'
        required: false
        default: '12'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pillow==11.0.0 imageio-ffmpeg==0.6.0

      - name: Download and optimise
        if: ${{ inputs.manifest != '' }}
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          python - <<'PY'
          import io, json, os, re, urllib.request
          from urllib.parse import urlparse
          from PIL import Image

          manifest = json.loads(os.environ['MANIFEST'])
          for name, url in manifest.items():
              if not re.fullmatch(r'[a-z0-9-]+', name):
                  raise SystemExit(f'bad file name: {name!r}')
              host = urlparse(url).hostname or ''
              if urlparse(url).scheme != 'https' or not (host == 'canva.com' or host.endswith('.canva.com')):
                  raise SystemExit(f'refusing non-Canva URL for {name}')
              data = urllib.request.urlopen(url, timeout=60).read()
              img = Image.open(io.BytesIO(data)).convert('RGB')
              img.thumbnail((1600, 1600), Image.LANCZOS)   # long edge ≤ 1600px
              out = f'assets/{name}.jpg'
              img.save(out, 'JPEG', quality=80, optimize=True, progressive=True)
              print(f'{out}: {img.width}x{img.height}, {os.path.getsize(out) // 1024} KB')
          PY

      - name: Search Mixkit
        if: ${{ inputs.video_search != '' }}
        env:
          QUERY: ${{ inputs.video_search }}
        run: |
          python - <<'PY'
          import os, re, urllib.request
          # Mixkit item links read /free-stock-video/<description>-<id>/, so the slug doubles as a title
          for kw in os.environ['QUERY'].split(','):
              slug = re.sub(r'[^a-z0-9]+', '-', kw.lower()).strip('-')
              seen = set()
              for page in (f'https://mixkit.co/free-stock-video/{slug}/', f'https://mixkit.co/free-stock-video/{slug}/?page=2'):
                  req = urllib.request.Request(page, headers={'User-Agent': 'Mozilla/5.0'})
                  try:
                      src = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'replace')
                  except Exception as e:
                      print(f'{page}: {e}'); continue
                  print(f'== {page}')
                  for title, vid in re.findall(r'href="/free-stock-video/([a-z0-9-]+)-(\d+)/"', src):
                      if vid in seen: continue
                      seen.add(vid)
                      print(f'{vid}\t{title}')
          PY

      - name: Encode hero video
        if: ${{ inputs.video_url != '' }}
        env:
          URL: ${{ inputs.video_url }}
          NAME: ${{ inputs.video_name }}
          START: ${{ inputs.video_start }}
          DURATION: ${{ inputs.video_duration }}
        run: |
          python - <<'PY'
          import os, re, subprocess, urllib.request
          from urllib.parse import urlparse
          import imageio_ffmpeg
          ff = imageio_ffmpeg.get_ffmpeg_exe()
          urls = [u.strip() for u in os.environ['URL'].split(',') if u.strip()]
          names = [n.strip() for n in (os.environ.get('NAME') or 'hero-wide').split(',')]
          if len(names) != len(urls):
              raise SystemExit('video_name needs one name per video_url')
          start = float(os.environ.get('START') or 0)
          dur = float(os.environ.get('DURATION') or 12)
          if not (0 <= start <= 120 and 3 <= dur <= 30):
              raise SystemExit('video_start / video_duration out of range')

          def ffmpeg(*args):
              subprocess.run([ff, '-y', '-loglevel', 'error', *args], check=True)
          log = []
          for url, name in zip(urls, names):
              host = urlparse(url).hostname or ''
              if urlparse(url).scheme != 'https' or host not in ('assets.mixkit.co', 'videos.pexels.com'):
                  raise SystemExit(f'refusing video URL from {host!r}')
              if not re.fullmatch(r'[a-z0-9-]+', name):
                  raise SystemExit(f'bad video name: {name!r}')
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  open('/tmp/src.mp4', 'wb').write(urllib.request.urlopen(req, timeout=120).read())
              except Exception as e:
                  print(f'skipping {name}: {url}: {e}'); continue
              # landscape: 1080 tall (1920x1080, desktop). portrait: 720 wide (720x1280, phones),
              # which keeps a 12s clip around 2MB. Silent H.264 with faststart, so it starts
              # playing before it has fully downloaded.
              scale = "scale='if(gt(iw,ih),-2,min(720,iw))':'if(gt(iw,ih),min(1080,ih),-2)':flags=lanczos"
              ffmpeg('-ss', str(start), '-t', str(dur), '-i', '/tmp/src.mp4', '-an',
                     '-vf', f'{scale},fps=30', '-c:v', 'libx264', '-preset', 'slow', '-crf', '27',
                     '-pix_fmt', 'yuv420p', '-movflags', '+faststart', f'assets/{name}.mp4')
              # poster = the first frame: shown until the video plays, and instead of it for reduced motion
              ffmpeg('-ss', str(start), '-i', '/tmp/src.mp4', '-frames:v', '1', '-vf', scale,
                     '-q:v', '5', f'assets/{name}-poster.jpg')
              print(name, os.path.getsize(f'assets/{name}.mp4') // 1024, 'KB', url)
              log.append(f'{name}: {url} start={start} duration={dur}')
          if not log:
              raise SystemExit('no clip could be fetched')
          open('assets/video-sources.txt', 'a').write('\n'.join(log) + '\n')
          PY

      - name: Commit
        if: ${{ inputs.manifest != '' || inputs.video_url != '' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "Add site media to assets"
          git pull --rebase
          git push
